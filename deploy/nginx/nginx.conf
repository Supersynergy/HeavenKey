# nginx.conf — HeavenKey Lab: HTTPS-Terminierung vor uac-api
#
# uac-api lauscht ausschliesslich auf 127.0.0.1:18240 (IPv4-Loopback).
# Diese Datei ist eine vollstaendige nginx.conf (kein Site-Snippet):
#   nginx -t -c /etc/nginx/nginx.conf
#   nginx -c /etc/nginx/nginx.conf
# oder den http-Block in eine bestehende Installation uebernehmen.
# Details und Alternativen (Caddy): docs/OPERATIONS.md
#
# server_name, HEAVENKEY_PUBLIC_ORIGIN und HEAVENKEY_RP_ID muessen passen.
# Host und Origin bleiben fuer die Pruefung durch die API unveraendert.

# Prozess-User ist distro-abhaengig: www-data (Debian/Ubuntu) oder nginx
# (RHEL/Fedora). Bei Abweichung die naechste Zeile anpassen/einkommentieren.
# user www-data;
worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log;
    sendfile on;
    server_tokens off;
    keepalive_timeout 65;

    # --- TLS-Defaults ----------------------------------------------------
    # Keine TLS-Versionen unter 1.2.
    ssl_protocols TLSv1.2 TLSv1.3;
    # Cipher-Auswahl wirkt nur fuer TLSv1.2; TLSv1.3-Suiten sind in
    # OpenSSL/nginx fest und sicher. Keine RC4/DES/3DES/NULL/EXPORT/aNULL.
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:HEAVENKEY:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # --- Timeouts ---------------------------------------------------------
    client_header_timeout 15s;
    client_body_timeout 30s;

    upstream heavenkey_api {
        # Einziger erlaubter Upstream: API auf Loopback.
        server 127.0.0.1:18240;
        keepalive 8;
    }

    server {
        # nginx >= 1.25: "listen 443 ssl;" plus eigene Zeile "http2 on;".
        listen 443 ssl http2;
        listen [::]:443 ssl http2;

        # Reservierten Beispielnamen und Zertifikatspfade ersetzen.
        # Fuer eine echte Domain Let's Encrypt per certbot —
        # siehe docs/OPERATIONS.md.
        server_name lab.example.test;

        ssl_certificate     /etc/heavenkey/tls/fullchain.pem;
        ssl_certificate_key /etc/heavenkey/tls/privkey.pem;

        # includeSubDomains/preload erst nach Pruefung der Domain setzen.
        add_header Strict-Transport-Security "max-age=31536000" always;

        # Request-Groesse: die API begrenzt Bodies selbst auf 32 KiB
        # (DefaultBodyLimit in apps/api/src/main.rs). Der Proxy darf
        # nicht darunter liegen; 64k laesst der API-Meldung Vortritt.
        client_max_body_size 64k;

        # Statische Health-Route ohne Upstream: liefert 200, solange der
        # Proxy laeuft — unabhaengig vom API-Zustand. Die API-eigene
        # Route /health wird weiter unten proxied.
        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location / {
            proxy_pass http://heavenkey_api;
            proxy_http_version 1.1;

            # $http_host erhaelt auch einen expliziten oeffentlichen Port.
            proxy_set_header Host $http_host;
            # Origin wird unveraendert durchgereicht (CSRF-Pruefung der API).
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Real-IP $remote_addr;
            # Keine Upgrade/WebSocket-Header: die API nutzt keines.

            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream off;

            # Bei Ausfall der API liefert nginx 502/504 — bewusst kein
            # naechster Upstream und kein Retry (SQLite-Zustand).
        }

        # Fehlerseiten knapp halten; die API liefert eigene JSON-Fehler.
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }

    # HTTP -> HTTPS (und spaeter ACME-http-01, falls certbot im Webroot-
    # Modus genutzt wird). Im Lab optional; fuer localhost meist deaktiviert
    # lassen, um Doppelstarts zu vermeiden.
    # server {
    #     listen 80;
    #     listen [::]:80;
    #     server_name lab.example.test;
    #     return 301 https://$host$request_uri;
    # }
}
