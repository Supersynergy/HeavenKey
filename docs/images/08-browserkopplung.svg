<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Browser verbinden: zwei bewusste Freigaben</title><desc id="desc">Schematischer Ablauf · Der native Berechtigungsdialog ist hier nicht abgebildet.. Schematische Bedienillustration, kein Screenshot.</desc><rect x="0" y="0" width="1200" height="710" rx="0" fill="#f4f4ef" stroke="none"/><rect x="0" y="0" width="1200" height="110" rx="0" fill="#102b37" stroke="none"/><text x="42" y="45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#dfc596">HeavenKey · Schritt für Schritt</text><text x="42" y="85" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Browser verbinden: zwei bewusste Freigaben</text><text x="42" y="148" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Schematischer Ablauf · Der native Berechtigungsdialog ist hier nicht abgebildet.</text><rect x="42" y="185" width="545" height="137" rx="12" fill="white" stroke="#d5ddda"/><circle cx="74" cy="219" r="20" fill="#dfc596"/><text x="68" y="226" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">1</text><text x="106" y="225" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">App: Einstellungen</text><text x="64" y="263" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Browser-Erweiterung verbinden öffnen.</text><text x="64" y="290" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Verbindungscode erzeugen wählen.</text><rect x="612" y="185" width="545" height="137" rx="12" fill="white" stroke="#d5ddda"/><circle cx="644" cy="219" r="20" fill="#dfc596"/><text x="638" y="226" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">2</text><text x="676" y="225" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">Einmaligen Code kopieren</text><text x="634" y="263" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Code kopieren · gilt nur zwei Minuten.</text><text x="634" y="290" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Nach Dienstneustart erneut koppeln.</text><rect x="42" y="340" width="545" height="137" rx="12" fill="white" stroke="#d5ddda"/><circle cx="74" cy="374" r="20" fill="#dfc596"/><text x="68" y="381" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">3</text><text x="106" y="380" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">Erweiterung öffnen</text><text x="64" y="418" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Lokalen Port und Kopplungscode eintragen.</text><text x="64" y="445" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Lokal verbinden wählen.</text><rect x="612" y="340" width="545" height="137" rx="12" fill="white" stroke="#d5ddda"/><circle cx="644" cy="374" r="20" fill="#dfc596"/><text x="638" y="381" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">4</text><text x="676" y="380" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">Browserberechtigung bestätigen</text><text x="634" y="418" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Optionale Berechtigung: http://localhost/*</text><text x="634" y="445" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Nach Ablehnung findet keine Kopplung statt.</text><rect x="42" y="495" width="545" height="137" rx="12" fill="white" stroke="#d5ddda"/><circle cx="74" cy="529" r="20" fill="#dfc596"/><text x="68" y="536" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">5</text><text x="106" y="535" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">Popup mit Masterpasswort öffnen</text><text x="64" y="573" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Tresor entsperren wählen.</text><text x="64" y="600" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Die Hauptseite entsperrt das Popup nicht.</text><rect x="612" y="495" width="545" height="137" rx="12" fill="white" stroke="#d5ddda"/><circle cx="644" cy="529" r="20" fill="#dfc596"/><text x="638" y="536" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">6</text><text x="676" y="535" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">Zugriff bewusst beenden</text><text x="634" y="573" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Sperren oder Popup schließen.</text><text x="634" y="600" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Verbindung entfernen oder in der App widerrufen.</text><text x="42" y="685" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#52696f">Schematische Bedienillustration · Quellstand 0.12.0 · kein Screenshot / keine Browser-Abnahme</text></svg>
