<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Chrome: Erweiterung laden</title><desc id="desc">Die Erweiterung öffnet HeavenKey; Passkeys bleiben auf der HeavenKey-Adresse.. Schematische Bedienillustration.</desc><rect x="0" y="0" width="1200" height="660" rx="0" fill="#f4f4ef" stroke="none"/><rect x="0" y="0" width="1200" height="110" rx="0" fill="#102b37" stroke="none"/><text x="42" y="45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#dfc596">HeavenKey · Schritt für Schritt</text><text x="42" y="85" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Chrome: Erweiterung laden</text><text x="42" y="148" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Die Erweiterung öffnet HeavenKey; Passkeys bleiben auf der HeavenKey-Adresse.</text><rect x="42" y="190" width="730" height="355" rx="12" fill="white" stroke="#d5ddda"/><rect x="42" y="190" width="730" height="43" rx="12" fill="#e5e9e6" stroke="none"/><text x="65" y="218" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">chrome://extensions</text><text x="70" y="275" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700" fill="#19323c">Erweiterungen</text><text x="500" y="272" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="400" fill="#52696f">Entwicklermodus</text><rect x="680" y="251" width="55" height="27" rx="12" fill="#36796c" stroke="none"/><circle cx="721" cy="264.5" r="10" fill="white"/><rect x="70" y="310" width="310" height="48" rx="5" fill="#f4f4ef" stroke="#b9c8c5"/><text x="90" y="342" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" fill="#19323c">Entpackte Erweiterung laden</text><rect x="70" y="390" width="650" height="113" rx="12" fill="#f4f4ef" stroke="#d5ddda"/><text x="95" y="428" font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" fill="#19323c">HeavenKey</text><text x="95" y="463" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Ordner mit manifest.json auswählen</text><circle cx="815" cy="250" r="20" fill="#dfc596"/><text x="809" y="257" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">1</text><text x="847" y="245" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">ZIP entpacken.</text><text x="847" y="272" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">chrome://extensions öffnen.</text><circle cx="815" cy="352" r="20" fill="#dfc596"/><text x="809" y="359" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">2</text><text x="847" y="347" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">Entwicklermodus aktivieren.</text><text x="847" y="374" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">Entpackten Ordner laden.</text><circle cx="815" cy="454" r="20" fill="#dfc596"/><text x="809" y="461" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">3</text><text x="847" y="449" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">HeavenKey in der Leiste</text><text x="847" y="476" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">anheften und öffnen.</text><text x="70" y="592" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#19323c">Edge: dieselben Schritte unter edge://extensions mit dem Chromium-Paket.</text><text x="42" y="635" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#52696f">Bedienillustration · Quellstand 0.7 · keine Browser-Abnahme</text></svg>
