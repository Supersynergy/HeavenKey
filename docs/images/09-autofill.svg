<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="710" viewBox="0 0 1200 710" role="img" aria-labelledby="title desc"><title id="title">Autofill: prüfen, auswählen und bestätigen</title><desc id="desc">Schematischer Ablauf · Die Website kann bewusst ausgefüllte Werte lesen.. Schematische Bedienillustration, kein Screenshot.</desc><rect x="0" y="0" width="1200" height="710" rx="0" fill="#f4f4ef" stroke="none"/><rect x="0" y="0" width="1200" height="110" rx="0" fill="#102b37" stroke="none"/><text x="42" y="45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#dfc596">HeavenKey · Schritt für Schritt</text><text x="42" y="85" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Autofill: prüfen, auswählen und bestätigen</text><text x="42" y="148" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Schematischer Ablauf · Die Website kann bewusst ausgefüllte Werte lesen.</text><rect x="42" y="185" width="545" height="137" rx="12" fill="white" stroke="#d5ddda"/><circle cx="74" cy="219" r="20" fill="#dfc596"/><text x="68" y="226" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">1</text><text x="106" y="225" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">Zielseite aktiv öffnen</text><text x="64" y="263" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">HTTPS-Seite, dann HeavenKey-Symbol öffnen.</text><text x="64" y="290" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Für Logins: Schema, Host und Port abgleichen.</text><rect x="612" y="185" width="545" height="137" rx="12" fill="white" stroke="#d5ddda"/><circle cx="644" cy="219" r="20" fill="#dfc596"/><text x="638" y="226" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">2</text><text x="676" y="225" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">Login oder Profil auswählen</text><text x="634" y="263" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Popup mit Masterpasswort entsperren.</text><text x="634" y="290" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Unter Werte prüfen die Angaben kontrollieren.</text><rect x="42" y="340" width="545" height="137" rx="12" fill="white" stroke="#d5ddda"/><circle cx="74" cy="374" r="20" fill="#dfc596"/><text x="68" y="381" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">3</text><text x="106" y="380" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">Felder der Seite prüfen</text><text x="64" y="418" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Felder und ihre Zuordnung auswählen.</text><text x="64" y="445" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Vorhandene Werte bleiben standardmäßig erhalten.</text><rect x="612" y="340" width="545" height="137" rx="12" fill="white" stroke="#d5ddda"/><circle cx="644" cy="374" r="20" fill="#dfc596"/><text x="638" y="381" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">4</text><text x="676" y="380" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">Geheimnisse extra freigeben</text><text x="634" y="418" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Passwort und Einmalcode freigeben: nur bei Bedarf.</text><text x="634" y="445" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Finanz- und Identitätsdaten: eigene Freigabe.</text><rect x="42" y="495" width="545" height="137" rx="12" fill="white" stroke="#d5ddda"/><circle cx="74" cy="529" r="20" fill="#dfc596"/><text x="68" y="536" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">5</text><text x="106" y="535" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">Angezeigte Zielseite bestätigen</text><text x="64" y="573" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Ich gebe die ausgewählten Werte für … frei.</text><text x="64" y="600" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Nur gewählte Felder füllen wählen.</text><rect x="612" y="495" width="545" height="137" rx="12" fill="white" stroke="#d5ddda"/><circle cx="644" cy="529" r="20" fill="#dfc596"/><text x="638" y="536" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">6</text><text x="676" y="535" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">Ergebnis prüfen</text><text x="634" y="573" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Es wird kein Formular abgesendet.</text><text x="634" y="600" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Rückgängig: unveränderte Seite, max. zwei Minuten.</text><text x="42" y="685" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#52696f">Schematische Bedienillustration · Quellstand 0.12.0 · kein Screenshot / keine Browser-Abnahme</text></svg>
