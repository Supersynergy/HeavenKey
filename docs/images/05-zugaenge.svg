<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Rechte teilen und wieder entziehen</title><desc id="desc">Geteilt wird ein begrenzter Zugang. Jeder bestätigt mit seinem eigenen Passkey.. Schematische Bedienillustration, kein Screenshot.</desc><rect x="0" y="0" width="1200" height="660" rx="0" fill="#f4f4ef" stroke="none"/><rect x="0" y="0" width="1200" height="110" rx="0" fill="#102b37" stroke="none"/><text x="42" y="45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#dfc596">HeavenKey · Schritt für Schritt</text><text x="42" y="85" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Rechte teilen und wieder entziehen</text><text x="42" y="148" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Geteilt wird ein begrenzter Zugang. Jeder bestätigt mit seinem eigenen Passkey.</text><rect x="42" y="195" width="356" height="255" rx="12" fill="white" stroke="#d5ddda"/><circle cx="77" cy="230" r="20" fill="#dfc596"/><text x="71" y="237" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">1</text><text x="67" y="285" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#19323c">Du bestätigst</text><text x="67" y="330" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Empfänger: Anna</text><text x="67" y="357" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Laufzeit: 30 Minuten</text><text x="67" y="384" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Weitergaben: 1</text><rect x="428" y="195" width="356" height="255" rx="12" fill="white" stroke="#d5ddda"/><circle cx="463" cy="230" r="20" fill="#dfc596"/><text x="457" y="237" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">2</text><text x="453" y="285" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#19323c">Anna gibt weiter</text><text x="453" y="330" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Empfänger: Ben</text><text x="453" y="357" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Laufzeit: 10 Minuten</text><text x="453" y="384" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Weitergaben: 0</text><rect x="814" y="195" width="356" height="255" rx="12" fill="white" stroke="#d5ddda"/><circle cx="849" cy="230" r="20" fill="#dfc596"/><text x="843" y="237" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">3</text><text x="839" y="285" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#19323c">Du widerrufst</text><text x="839" y="330" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Annas Zugang endet.</text><text x="839" y="357" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Bens abhängiger Zugang</text><text x="839" y="384" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">wird ebenfalls gesperrt.</text><rect x="42" y="480" width="1115" height="90" rx="12" fill="#e8eeea" stroke="none"/><text x="65" y="513" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="700" fill="#19323c">Alle nutzen ihre eigenen Passkeys.</text><text x="65" y="547" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#19323c">HeavenKey prüft Rechte, Ablauf und Widerruf vor jeder geschützten Ausführung.</text><text x="42" y="635" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#52696f">Schematische Bedienillustration · Quellstand 0.7 · kein Screenshot / keine Browser-Abnahme</text></svg>
