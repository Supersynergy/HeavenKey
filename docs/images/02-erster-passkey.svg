ef" stroke="#b9c8c5"/><text x="85" y="425" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#19323c">••••••••••••••••••••</text><rect x="70" y="480" width="245" height="44" rx="5" fill="#102b37" stroke="none"/><text x="92" y="509" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="white">Passkey erstellen</text><circle cx="782" cy="243" r="20" fill="#dfc596"/><text x="776" y="250" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">1</text><text x="815" y="238" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">Programm zeigt den Pfad zu</text><text x="815" y="265" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">owner-bootstrap.txt an.</text><circle cx="782" cy="335" r="20" fill="#dfc596"/><text x="776" y="342" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">2</text><text x="815" y="330" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">Code aus dieser Datei</text><text x="815" y="357" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">ins Eigentümerfeld übertragen.</text><circle cx="782" cy="427" r="20" fill="#dfc596"/><text x="776" y="434" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">3</text><text x="815" y="422" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">Passkey am Gerät bestätigen.</text><text x="815" y="449" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">Danach mit Passkey anmelden.</text><text x="70" y="593" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#19323c">Als Gast: eigenen Namen wählen und das Einrichtungscode-Feld leer lassen.</text><text x="42" y="635" font-family="Arial,Helvetica,sans-serif" font-si