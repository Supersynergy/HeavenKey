<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">Zwei Sicherungen für zwei Aufgaben</title><desc id="desc">Kontozugang und Entschlüsselung haben unabhängige Wiederherstellungswege.. Schematische Bedienillustration.</desc><rect x="0" y="0" width="1200" height="660" rx="0" fill="#f4f4ef" stroke="none"/><rect x="0" y="0" width="1200" height="110" rx="0" fill="#102b37" stroke="none"/><text x="42" y="45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#dfc596">HeavenKey · Schritt für Schritt</text><text x="42" y="85" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffffff">Zwei Sicherungen für zwei Aufgaben</text><text x="42" y="148" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Kontozugang und Entschlüsselung haben unabhängige Wiederherstellungswege.</text><rect x="42" y="195" width="545" height="250" rx="12" fill="white" stroke="#d5ddda"/><circle cx="78" cy="230" r="20" fill="#dfc596"/><text x="72" y="237" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">1</text><text x="67" y="285" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#19323c">Konto wiederherstellen</text><text x="67" y="330" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Einmalcode aus der Sicherung.</text><text x="67" y="357" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Erstellt einen neuen Passkey.</text><text x="67" y="384" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Sperrt alte Passkeys und Agenten.</text><rect x="621" y="195" width="545" height="250" rx="12" fill="white" stroke="#d5ddda"/><circle cx="657" cy="230" r="20" fill="#dfc596"/><text x="651" y="237" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">2</text><text x="646" y="285" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#19323c">Tresor entschlüsseln</text><text x="646" y="330" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Separater Tresorschlüssel.</text><text x="646" y="357" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Entschlüsselt deinen Tresor lokal.</text><text x="646" y="384" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Danach neuen Passkey berechtigen.</text><rect x="42" y="480" width="1115" height="90" rx="12" fill="#e8eeea" stroke="none"/><text x="65" y="514" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">Sicherung herunterladen und getrennt aufbewahren.</text><text x="65" y="548" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#19323c">Für den Server zusätzlich Datenordner UND OS-Keystore oder externe Schutzdatei sichern.</text><text x="42" y="635" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#52696f">Bedienillustration · Quellstand 0.7 · keine Browser-Abnahme</text></svg>
