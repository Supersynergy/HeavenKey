<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660" role="img" aria-labelledby="title desc"><title id="title">In drei Schritten starten</title><desc id="desc">Fertiges Vorschau-Paket verwenden oder den neuen Quellstand lokal bauen.. Schematische Bedienillustration.</desc><rect x="0" y="0" width="1200" height="660" rx="0" fill="#f4f4ef" stroke="none"/><rect x="0" y="0" width="1200" height="110" rx="0" fill="#102b37" stroke="none"/><text x="42" y="45" font-family="Arial,Helvetica,sans-serif" font-size="16" font-weight="600" fill="#dfc596">HeavenKey · Schritt für Schritt</text><text x="42" y="85" font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="700" fill="#ffffff">In drei Schritten starten</text><text x="42" y="148" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#52696f">Fertiges Vorschau-Paket verwenden oder den neuen Quellstand lokal bauen.</text><rect x="42" y="195" width="356" height="255" rx="12" fill="white" stroke="#d5ddda"/><circle cx="77" cy="230" r="20" fill="#dfc596"/><text x="71" y="237" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">1</text><text x="67" y="285" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#19323c">Paket wählen</text><text x="67" y="325" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Passendes Betriebssystem</text><text x="67" y="352" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">und Prozessor auswählen.</text><text x="67" y="379" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Archiv vollständig entpacken.</text><rect x="428" y="195" width="356" height="255" rx="12" fill="white" stroke="#d5ddda"/><circle cx="463" cy="230" r="20" fill="#dfc596"/><text x="457" y="237" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">2</text><text x="453" y="285" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#19323c">Programm starten</text><text x="453" y="325" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Windows: Start HeavenKey.cmd</text><text x="453" y="352" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Mac: Start HeavenKey.command</text><text x="453" y="379" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Linux: ./start.sh</text><rect x="814" y="195" width="356" height="255" rx="12" fill="white" stroke="#d5ddda"/><circle cx="849" cy="230" r="20" fill="#dfc596"/><text x="843" y="237" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#19323c">3</text><text x="839" y="285" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="700" fill="#19323c">Browser öffnen</text><text x="839" y="325" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">http://localhost:18240</text><text x="839" y="352" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Programm geöffnet lassen.</text><text x="839" y="379" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="400" fill="#52696f">Die Erweiterung ist optional.</text><rect x="42" y="480" width="1115" height="90" rx="12" fill="#e8eeea" stroke="none"/><text x="65" y="513" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="700" fill="#19323c">Neuer 0.7-Quellstand: einfacher Entwicklungsstart</text><text x="65" y="546" font-family="Arial,Helvetica,sans-serif" font-size="18" font-weight="400" fill="#19323c">Rust + Bun 1.4.2 + Python installieren → python3 scripts/first_run.py</text><text x="42" y="635" font-family="Arial,Helvetica,sans-serif" font-size="13" font-weight="400" fill="#52696f">Bedienillustration · Quellstand 0.7 · keine Browser-Abnahme</text></svg>
