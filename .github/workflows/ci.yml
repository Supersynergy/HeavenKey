name: HeavenKey CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavenkey-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 4
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly-2026-10-11
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Locked dependencies
        run: |
          bun install --frozen-lockfile --ignore-scripts
          cargo fetch --locked
      - name: Source checks and virtual-authenticator browser tests
        run: python3 scripts/run.py ci 900 -- bash scripts/ci.sh
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heavenkey-evidence
          path: |
            docs/evidence/e2e.json
            docs/evidence/ci.log
            docs/evidence/ci-e2e.log
            docs/evidence/browser-*.png
          retention-days: 7
