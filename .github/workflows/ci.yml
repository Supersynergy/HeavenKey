name: HeavenKey CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: heavenkey-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 4
      CHROME_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Initialize fresh CI evidence
        run: bash scripts/ci.sh prepare
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        with:
          toolchain: nightly-2026-10-11
          components: rustfmt, clippy
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - name: Restore Rust cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}-${{ hashFiles('**/*.rs', '**/Cargo.toml') }}
          restore-keys: |
            rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '.cargo/config.toml') }}-
      - name: Pinned Rust security tools
        timeout-minutes: 5
        run: |
          tools_dir="$RUNNER_TEMP/heavenkey-tools"
          mkdir -p "$tools_dir"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            https://github.com/EmbarkStudios/cargo-deny/releases/download/0.20.2/cargo-deny-0.20.2-x86_64-unknown-linux-musl.tar.gz \
            -o "$tools_dir/deny.tar.gz"
          curl --fail --silent --show-error --location --retry 2 --max-time 60 \
            https://github.com/rustsec/rustsec/releases/download/cargo-audit/v0.22.2/cargo-audit-x86_64-unknown-linux-musl-v0.22.2.tgz \
            -o "$tools_dir/audit.tar.gz"
          printf '9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f  %s\n' "$tools_dir/deny.tar.gz" | sha256sum --check
          printf '7fb9497f8594b389e5fce5ef9b92db08432996895b2e0c5a0167a69ed445c428  %s\n' "$tools_dir/audit.tar.gz" | sha256sum --check
          tar -xzf "$tools_dir/deny.tar.gz" -C "$tools_dir"
          tar -xzf "$tools_dir/audit.tar.gz" -C "$tools_dir"
          install -m 755 "$tools_dir/cargo-deny-0.20.2-x86_64-unknown-linux-musl/cargo-deny" "$tools_dir/cargo-deny"
          install -m 755 "$tools_dir/cargo-audit-x86_64-unknown-linux-musl-v0.22.2/cargo-audit" "$tools_dir/cargo-audit"
          echo "$tools_dir" >> "$GITHUB_PATH"
          "$tools_dir/cargo-deny" --version
          "$tools_dir/cargo-audit" --version
      - name: Locked dependencies
        timeout-minutes: 3
        run: |
          bun install --frozen-lockfile --ignore-scripts
          cargo fetch --locked
      - name: Runtime versions
        run: |
          rustc --version
          bun --version
          python3 --version
          "$CHROME_PATH" --version
      - name: Source and regression checks
        run: python3 scripts/run.py ci-source 900 -- bash scripts/ci.sh source
      - name: Dependency security and licenses
        run: python3 scripts/run.py ci-security 180 -- bash scripts/ci.sh security
      - name: Build application
        run: python3 scripts/run.py ci-build 300 -- bash scripts/ci.sh build
      - name: Virtual-authenticator browser tests
        run: bash scripts/ci.sh e2e
      - name: Test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: heavenkey-evidence
          path: |
            docs/evidence/e2e.json
            docs/evidence/ci-*.log
            docs/evidence/commands.jsonl
            docs/evidence/heavenkey-missing-binary.json
            docs/evidence/browser-*.png
            docs/evidence/failure-diagnostic.json
            docs/evidence/failure-*.png
          retention-days: 7
          if-no-files-found: warn
