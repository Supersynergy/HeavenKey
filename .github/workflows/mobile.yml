name: HeavenKey Android

on:
  workflow_call:
  pull_request:
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
      - 'scripts/mobile_native_gate.py'
      - 'scripts/android_device_acceptance.py'
      - 'scripts/android_release.py'
      - 'scripts/android_signing_test.py'
      - 'scripts/android_preview.py'
      - '.github/workflows/android-release.yml'
  push:
    branches: [main]
    paths:
      - 'apps/mobile/**'
      - '.github/workflows/mobile.yml'
      - 'scripts/android_device_acceptance.py'
      - 'scripts/android_release.py'
      - 'scripts/android_signing_test.py'
      - 'scripts/android_preview.py'

permissions:
  contents: read

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CI: 'true'
      FLUTTER_SUPPRESS_ANALYTICS: 'true'
      DASH__SUPPRESS_ANALYTICS: 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pinned Flutter
        run: |
          git clone --depth=1 --branch 3.47.2 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          test "$(git -C "$RUNNER_TEMP/flutter" rev-parse HEAD)" = d3b14c876900e553bc736ca19295fc09e3853e8e
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve locked dependencies
        working-directory: apps/mobile
        run: flutter pub get --enforce-lockfile
      - name: Analyze and test UI and controller
        working-directory: apps/mobile
        run: |
          dart format --output=none --set-exit-if-changed lib test integration_test
          flutter analyze --no-pub
          flutter test --no-pub
      - name: Check Android security configuration
        run: python3 scripts/mobile_native_gate.py android
      - name: Install pinned Android build dependencies
        run: |
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'; then
              exit 0
            fi
            echo "SDK download/extraction failed on attempt $attempt; retrying with the SDK manager."
          done
          exit 1
      - name: Build Android and execute portable backup tests
        working-directory: apps/mobile
        run: |
          flutter build apk --debug --no-pub
          cd android
          ./gradlew :app:testDebugUnitTest --no-daemon
          ./gradlew :app:assembleDebugAndroidTest --no-daemon
      - name: Install isolated Android emulator
        run: |
          for attempt in 1 2 3; do
            if "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'system-images;android-36;google_apis;x86_64' 'build-tools;36.0.0'; then
              break
            fi
            echo "Emulator image download/extraction failed on attempt $attempt."
            if [ "$attempt" = 3 ]; then exit 1; fi
          done
          test -e /dev/kvm
          sudo chmod a+rw /dev/kvm
      - name: Execute actual Keystore and portable passkey recovery
        run: python3 scripts/android_device_acceptance.py
      - name: Build and verify release artifacts with disposable keys
        run: python3 scripts/android_signing_test.py --release-artifacts
      - name: Build isolated preview with release runtime
        env:
          HEAVENKEY_ANDROID_PREVIEW: 'true'
        run: |
          (cd apps/mobile && flutter build apk --release --split-per-abi)
          python3 - <<'PY'
          import os, re, shutil, subprocess
          from pathlib import Path
          version, code = re.search(r'^version: (\d+\.\d+\.\d+)\+(\d+)$', Path('apps/mobile/pubspec.yaml').read_text(), re.M).groups()
          output = Path('dist/android-preview'); output.mkdir(parents=True, exist_ok=True)
          for abi in ('arm64-v8a', 'armeabi-v7a', 'x86_64'):
              shutil.copyfile(f'apps/mobile/build/app/outputs/flutter-apk/app-{abi}-release.apk', output / f'HeavenKey-{version}-android-preview-{abi}.apk')
          subprocess.run(['python3', 'scripts/android_preview.py', str(output), '--version', version, '--code', code,
                          '--commit', os.environ['GITHUB_SHA'], '--device-evidence', 'dist/android-device-acceptance/acceptance.json'], check=True)
          PY
      - name: Preserve verified installable preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-preview-${{ github.sha }}
          path: dist/android-preview/
          if-no-files-found: error
          retention-days: 14
      - name: Preserve source-bound native test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: android-device-acceptance-${{ github.sha }}
          path: dist/android-device-acceptance/
          if-no-files-found: warn
          retention-days: 14
