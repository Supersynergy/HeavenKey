name: Runner routing probe

on:
  push:
    branches: [fix/ci-hardening-20261012]

permissions:
  contents: read

jobs:
  routing:
    runs-on: [self-hosted, 'heavenkey-probe-${{ github.sha }}']
    timeout-minutes: 3
    steps:
      - name: Verify free runner routing
        run: python3 -c 'import platform; print(platform.system(), platform.machine())'
