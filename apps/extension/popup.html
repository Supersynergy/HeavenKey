<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>HeavenKey</title>
  <link rel="stylesheet" href="popup.css">
  <script src="popup.js" defer></script>
</head>
<body>
  <header>HeavenKey <span>Zugang beginnt mit Zustimmung.</span></header>
  <main>
    <h1>Deine lokalen Zugänge.</h1>
    <p>Starte zuerst HeavenKey auf diesem Computer. Anmeldung und Freigaben bestätigst du in der Weboberfläche.</p>
    <form id="open-form">
      <label for="port">Lokaler Port</label>
      <input id="port" type="number" min="1" max="65535" value="18240" required>
      <button type="submit">HeavenKey öffnen</button>
    </form>
    <output id="status" role="status" aria-live="polite"></output>
    <p class="note">Die Erweiterung öffnet nur localhost. Sie liest keine Webseiten, Passkeys oder Einrichtungscodes.</p>
  </main>
</body>
</html>
