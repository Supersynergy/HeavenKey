[package]
name = "uac-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
openssl.workspace = true
zeroize.workspace = true
uac-browser-pipe = { path = "../../crates/browser-pipe" }
uac-keystore = { path = "../../crates/keystore" }
uac-recovery = { path = "../../crates/recovery" }
uac-verifier = { path = "../../crates/verifier" }
axum.workspace = true
tokio.workspace = true
webauthn-rs.workspace = true
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
rusqlite.workspace = true
base64.workspace = true
sha2.workspace = true
ed25519-dalek.workspace = true
rand.workspace = true
ssh2 = "=0.9.6"
suppaftp = { version = "=12.1.0", features = ["native-tls"] }
native-tls = "=0.2.18"
log = { version = "=0.4.34", features = ["max_level_off", "release_max_level_off"] }

[features]
portable = ["rusqlite/bundled-sqlcipher-vendored-openssl"]
