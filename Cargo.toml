[workspace]
members = ["apps/api", "crates/verifier"]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
axum = "=0.8.9"
tokio = { version = "=1.53.2", features = ["macros", "rt-multi-thread", "net", "signal"] }
webauthn-rs = "=0.5.5"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.154"
uuid = { version = "=1.26.1", features = ["v4", "serde"] }
rusqlite = { version = "=0.40.2", features = ["bundled"] }
base64 = "=0.22.1"
sha2 = "=0.10.9"
ed25519-dalek = "=2.2.0"
rand = "=0.9.5"

[profile.dev.package."*"]
opt-level = 1
